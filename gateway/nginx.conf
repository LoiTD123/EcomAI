# Chạy Nginx dưới quyền user nginx
user  nginx;

# Tự động điều chỉnh số lượng worker process dựa trên số nhân CPU khả dụng
worker_processes  auto;

# Đường dẫn lưu log lỗi của Nginx và mức độ cảnh báo (notice)
error_log  /var/log/nginx/error.log notice;

# File lưu tiến trình PID của Nginx để quản lý service
pid        /var/run/nginx.pid;

# Cấu hình kết nối đồng thời
events {
    # Tối đa 1024 kết nối đồng thời trên mỗi worker process
    worker_connections  1024;
}

# Cấu hình giao thức HTTP và API Gateway Routing
http {
    # Nạp các định dạng file (MIME types) được hỗ trợ
    include       /etc/nginx/mime.types;
    # Kiểu dữ liệu mặc định khi không xác định được định dạng
    default_type  application/octet-stream;

    # Định dạng ghi log truy cập (Access Log) để lưu thông tin request chi tiết
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # Đường dẫn và định dạng log ghi nhận toàn bộ truy cập vào hệ thống
    access_log  /var/log/nginx/access.log  main;

    # Tối ưu hóa truyền tải dữ liệu trực tiếp từ ổ đĩa (sendfile)
    sendfile        on;
    # Thời gian giữ kết nối TCP mở (keepalive) để tái sử dụng kết nối
    keepalive_timeout  65;

    # Cấu hình máy chủ API Gateway lắng nghe cổng 80 trong mạng nội bộ Docker
    server {
        listen 80;
        server_name localhost;

        # ============================================================================
        # 1. ROUTING FRONTEND APPS
        # ============================================================================

        # Điều hướng trang khách hàng (React Client App)
        location / {
            # Chuyển tiếp request sang container 'frontend' ở cổng 3000
            proxy_pass http://frontend:3000;
            
            # Giữ lại Header Host gốc của Client gửi lên
            proxy_set_header Host $host;
            # Gửi kèm IP thực tế của khách hàng (Client IP) sang backend
            proxy_set_header X-Real-IP $remote_addr;
            # Chuỗi các IP chuyển tiếp qua proxy để backend truy vết
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Giao thức gốc (HTTP/HTTPS) mà Client sử dụng
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================================================
        # 2. ROUTING BACKEND MICROSERVICES (APIs)
        # ============================================================================

        # Điều hướng API quản lý và xác thực người dùng (User Service)
        location /api/v1/auth {
            proxy_pass http://user-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Điều hướng API danh mục và sản phẩm (Product Catalog Service)
        location /api/v1/products {
            proxy_pass http://product-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Đường dẫn tĩnh phục vụ hình ảnh sản phẩm đã tải lên (Uploaded Media Files)
        location /media/ {
            proxy_pass http://product-service:8000/media/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Điều hướng API giỏ hàng (Cart Service)
        location /api/v1/cart {
            proxy_pass http://cart-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Điều hướng API tạo và quản lý đơn hàng (Order Service)
        location /api/v1/orders {
            proxy_pass http://order-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Điều hướng API thanh toán (Payment Service)
        location /api/v1/payments {
            proxy_pass http://payment-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Điều hướng API vận chuyển (Shipping Service)
        location /api/v1/shipping {
            proxy_pass http://shipping-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================================================
        # 3. ROUTING AI ENGINE
        # ============================================================================

        # Điều hướng API Trợ lý ảo AI & Gợi ý sản phẩm (AI Service)
        location /api/v1/ai {
            proxy_pass http://ai-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================================================
        # 4. TELEMETRY / MONITORING
        # ============================================================================

        # Endpoint cung cấp trạng thái của Nginx phục vụ cho việc giám sát (Metrics Collection)
        location /nginx_status {
            # Kích hoạt module đo lường hiệu năng của Nginx
            stub_status on;
            # Tắt ghi log truy cập đối với endpoint này để tránh rác log file
            access_log off;
            # Cho phép mọi nguồn trong mạng nội bộ truy cập để lấy metrics (Nginx Exporter)
            allow all;
        }
    }
}
